# ============================================================
# Artoo 统一编排（唯一真源）
#
# 用 profiles 区分两组服务，不再拆多份文件：
#   infra —— 中间件：etcd / minio / milvus / postgres / redis
#   app   —— 应用：  backend / worker / frontend
#
# 配置全部走 .env（env_file 一把注入），compose 内只写「容器内固定值」
# （服务名、容器端口、连接串），用户无需也不应在 .env 里配它们。
#
# 常用命令：
#   生产单机（跳过 dev 端口暴露）：
#     docker compose -f docker-compose.yml --profile infra --profile app up -d
#   本地开发（自动加载 override 暴露中间件端口，应用用 make dev 跑在宿主机）：
#     docker compose --profile infra up -d
# ============================================================

# 日志上限（所有服务共用）：2026-08-21 生产事故——milvus 的 json.log 无上限增长
# 至 442G 撑满 /data，postgres 崩溃恢复因磁盘满卡死，backend/worker 连环重启。
# json-file 驱动默认不限大小，必须显式设 max-size/max-file。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

# 内存上限（混部机器必须设）：本机与 fasiclaw / agent-workflow / funasr / ES8 等
# 多个业务共享 62G 内存，任一容器无限膨胀都会连带拖垮同机其它业务。
# 这里用 mem_limit（Compose V2 对 `docker compose up` 稳定生效；deploy.resources
# 在部分 V2 版本需 --compatibility，不用它以免静默失效）。
#
# 语义提醒：mem_limit 是**硬上限**，超限触发容器内 OOM Kill（进程被杀 + restart），
# 不是软限流。因此每项都留了 2~6 倍于当前实测占用的余量：宁可被限制，不可拖垮整机。
# 上限之和（约 35.5G）故意大于可用内存（42G）——上限是天花板不是预留，
# 真实占用约 7G；这样既拦住单点跑飞，又不浪费容量。
services:
  # ============ 中间件（profile: infra）============
  etcd:
    container_name: arag-etcd
    image: quay.io/coreos/etcd:v3.5.25
    profiles: ["infra"]
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging: *default-logging
    # 只存 Milvus 元数据（collection/分区/segment 索引信息），实测 434M；
    # ETCD_QUOTA_BACKEND_BYTES 已限 4G 磁盘，内存给 2G 足够
    mem_limit: 2g
    restart: unless-stopped

  minio:
    container_name: arag-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    profiles: ["infra"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    # 健康检查用 MinIO 自带的 mc（镜像内置），不依赖 curl —— 该镜像无 curl，
    # 用 curl 探针会永久失败导致容器被标 unhealthy，进而阻断 milvus/backend 启动。
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging: *default-logging
    # 同时承载 Milvus 的 segment 存储与知识库源文件，会缓存热对象，实测 1.99G
    mem_limit: 3g
    restart: unless-stopped

  milvus:
    container_name: arag-milvus
    image: milvusdb/milvus:v2.5.4
    profiles: ["infra"]
    command: ["milvus", "run", "standalone"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
      # mmap 调优：把冷数据/原始向量放磁盘 + page cache，降低常驻内存。详见文件注释。
      - ./deploy/milvus-user.yaml:/milvus/configs/user.yaml:ro
    expose:
      - "19530"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      # standalone 冷启动需 30~60s（加载 collection + 建 mmap 映射）。
      # 无 start_period 时启动期探测失败会直接计入 retries，容器被误判 unhealthy，
      # 进而让 depends_on: service_healthy 的 backend/worker 连带启动失败。
      start_period: 90s
    logging: *default-logging
    # Artoo 内存占用的大头，随向量总量增长。1024 维下索引常驻约 5KB/向量
    # （milvus-user.yaml 里 vectorIndex 不走 mmap），12G 约对应 200 万向量。
    # 逼近上限时把 queryNode.mmap.vectorIndex 改 true（索引转磁盘，略增延迟）。
    # mem_reservation 是软预留：内存紧张时内核优先从别处回收，保 Milvus 检索延迟。
    mem_limit: 12g
    mem_reservation: 2g
    restart: unless-stopped

  postgres:
    container_name: arag-postgres
    image: postgres:16-alpine
    profiles: ["infra"]
    # 抬高最大连接数：每个 backend/worker 进程一个连接池（pool 10 + overflow 20 = 上限 30）。
    # BACKEND_WORKERS=2 + 1 worker ≈ 峰值 90 连接，默认 100 余量过窄，设 200 留足。
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
    environment:
      POSTGRES_DB: artoo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-Asia/Shanghai}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 首次初始化 data 目录 / 崩溃恢复重放 WAL 期间不接受连接
      start_period: 30s
    logging: *default-logging
    # shared_buffers 512M + work_mem 4M × 最多 200 连接 + 维护内存，3G 有余量
    mem_limit: 3g
    mem_reservation: 768m
    restart: unless-stopped

  redis:
    container_name: arag-redis
    image: redis:7-alpine
    profiles: ["infra"]
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    # maxmemory-policy 必须是 volatile-lru，不能用 allkeys-lru：
    #   本 Redis 同时装「检索结果缓存」（rag:cache:*，带 TTL，可淘汰）与
    #   「入库/图谱/会话上传任务 Stream」（pipeline:tasks 等，**无 TTL，绝不能淘汰**）。
    #   allkeys-lru 在内存压力下会把任务 Stream 也淘汰掉 → 静默丢文档入库任务。
    #   volatile-lru 只淘汰设了 TTL 的键，正好只命中缓存。
    command:
      - "redis-server"
      - "--ignore-warnings"
      - "ARM64-COW-BUG"
      - "--maxmemory"
      - "1500mb"
      - "--maxmemory-policy"
      - "volatile-lru"
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging
    # 略高于 maxmemory，给 RDB 落盘时的 fork COW 留空间
    mem_limit: 2g
    restart: unless-stopped

  # ============ 知识图谱（profile: graph，默认不启动）============
  # Neo4j + APOC，仅当显式带 --profile graph 才启动；不开图谱零成本。
  # 启动：docker compose --profile infra --profile graph up -d
  #       （应用侧还需在 .env 设 GRAPH_ENABLE=true 才会真正连接/抽取）
  neo4j:
    container_name: arag-neo4j
    image: neo4j:5-community        # 需 GDS（阶段 4 社区发现）时改 neo4j:5-enterprise
    profiles: ["graph"]
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # 账号口令走 .env（与应用侧 NEO4J_USERNAME/NEO4J_PASSWORD 一致），默认 neo4j/password
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc"]
      # ★ Neo4j 5 的配置命名空间已从 dbms.* 迁到 server.*：
      #   旧名 NEO4J_dbms_memory_heap_max__size / NEO4J_dbms_memory_pagecache_size
      #   在 Neo4j 5 下**不生效**（仅记一条 Unrecognized setting 警告后忽略），
      #   Neo4j 会退回按整机内存自动推算堆大小 —— 在 62G 机器上会推得很大。
      #   下面是 Neo4j 5 的正确名字，务必用这套。
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512M
      # 单事务内存上限：图谱抽取用 apoc.periodic.iterate 批量写，防单批撑爆堆
      - NEO4J_db_memory_transaction_total_max=512M
    ports:
      # 7474 = 浏览器管理台（HTTP），7687 = Bolt 驱动端口。
      # ★ 只绑 127.0.0.1：应用经容器网络以 bolt://neo4j:7687 连接，不需要对外暴露；
      #   若绑 0.0.0.0，公网 IP 主机上等于把图库管理台directly 暴露出去。
      #   需要远程用浏览器管理台时走 SSH 隧道：ssh -L 7474:127.0.0.1:7474 <host>
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    # 堆 1G + pagecache 512M + JVM 元空间/线程栈/直接内存，3G 上限有充足余量
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      # APOC 插件解包 + 加载较慢
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped

  # ============ 应用（profile: app）============
  migrate:
    container_name: arag-migrate
    image: artoo-backend:latest
    build: ./backend
    profiles: ["app"]
    # 一次性迁移任务：所有 backend/worker 必须等它成功退出后再启动，避免多个
    # uvicorn worker 并行执行 DDL，或启动迁移被 Worker 长事务阻塞。
    command: ["python", "-m", "app.migrate"]
    env_file: .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/artoo
      - AUTO_MIGRATE_ON_STARTUP=false
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 1g
    restart: "no"

  backend:
    container_name: arag-backend
    image: artoo-backend:latest
    build: ./backend
    profiles: ["app"]
    # 单机多进程，提升并发问答吞吐与单进程崩溃韧性。进程数由 BACKEND_WORKERS 控制。
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-2}"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # 业务可调配置统一从 .env 注入；下方 environment 只覆盖「容器内拓扑」固定值。
    env_file: .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/artoo
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - REDIS_URL=redis://redis:6379/0
      # 对象存储（知识库源文件权威存储）：复用 Milvus 的 MinIO，独立 bucket 隔离
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - MINIO_BUCKET=aladdin-documents
      # 知识图谱 Neo4j 连接（容器内拓扑固定值）。是否真正连接由 .env 的 GRAPH_ENABLE 控制，
      # 默认 false 即不连；账号口令走 .env 的 NEO4J_USERNAME/NEO4J_PASSWORD。
      - NEO4J_URI=bolt://neo4j:7687
      - AUTO_MIGRATE_ON_STARTUP=false
    volumes:
      - upload_data:/app/data
      - ./logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging
    # BACKEND_WORKERS=2 个 uvicorn 进程，各持 DB 连接池 + 检索/Agent 上下文缓冲；
    # 同步上传与 Redis 不可用时的降级入库也在这里跑。实测 1.07G，给 4G 余量。
    # 调大 BACKEND_WORKERS 需按比例调大这里。
    mem_limit: 4g
    restart: unless-stopped

  worker:
    container_name: arag-worker
    image: artoo-backend:latest
    build: ./backend
    profiles: ["app"]
    command: ["python", "-m", "app.worker_main"]
    env_file: .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/artoo
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - REDIS_URL=redis://redis:6379/0
      # 对象存储（知识库源文件权威存储）：复用 Milvus 的 MinIO，独立 bucket 隔离
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - MINIO_BUCKET=aladdin-documents
      # 知识图谱 Neo4j 连接（容器内拓扑固定值）。GraphExtractWorker 抽取写图用；
      # 是否真正连接由 .env 的 GRAPH_ENABLE 控制，默认 false 即不连。
      - NEO4J_URI=bolt://neo4j:7687
      - AUTO_MIGRATE_ON_STARTUP=false
    volumes:
      - upload_data:/app/data
      - ./logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging
    # Artoo 里最吃内存的应用进程：文档解析（pymupdf 加载大 PDF 到内存）、
    # 分块、embedding 批次缓冲、OCR 图片缓冲同时在途。
    # 上限须与 .env 的 PIPELINE_MAX_CONCURRENT（在途文档数）匹配：
    #   6 个并发文档 × 单文档峰值约 500MB~1G，故给 6G。
    #   调大 PIPELINE_MAX_CONCURRENT 必须同步调大这里，否则解析大文件时会被 OOM Kill。
    mem_limit: 6g
    restart: unless-stopped

  frontend:
    container_name: arag-frontend
    image: artoo-frontend:latest
    build: ./frontend
    profiles: ["app"]
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${FRONTEND_PORT:-8888}:80"
    # nginx.conf 已在镜像内（frontend/nginx.conf），无需挂载覆盖。
    # 运行时前端配置：只读挂载覆盖镜像内的 /config.js，部署人员改宿主机文件后刷新页面即生效，
    # 无需重新构建镜像。可调动态背景策略（prismBackground: auto/on/off）等。
    volumes:
      - ./frontend/public/config.js:/usr/share/nginx/html/config.js:ro
    depends_on:
      - backend
    logging: *default-logging
    # 纯静态资源 nginx，实测 8MB
    mem_limit: 512m
    restart: unless-stopped

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  postgres_data:
  redis_data:
  upload_data:
  neo4j_data:

networks:
  default:
    name: arag-network
